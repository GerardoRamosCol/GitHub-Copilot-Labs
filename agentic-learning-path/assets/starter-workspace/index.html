<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northstar Release Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <header>
      <p class="eyebrow">Northstar Collaboration</p>
      <h1>Release readiness</h1>
      <p id="release-details"></p>
    </header>

    <section aria-labelledby="changes-heading">
      <h2 id="changes-heading">Planned changes</h2>
      <ul id="change-list"></ul>
    </section>

    <section aria-labelledby="risks-heading">
      <h2 id="risks-heading">Open risks</h2>
      <ul id="risk-list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
