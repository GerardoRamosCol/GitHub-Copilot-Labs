trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

jobs:
  - job: Python
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.11"
      - script: python -m pip install -e ".[test]"
        workingDirectory: tracks/python
        displayName: Install Python dependencies
      - script: python -m pytest
        workingDirectory: tracks/python
        displayName: Test Python track

  - job: DotNet
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          version: "8.x"
      - script: dotnet test --configuration Release
        workingDirectory: tracks/dotnet
        displayName: Test .NET track

  - job: TypeScript
    pool:
      vmImage: ubuntu-latest
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: "22.x"
      - script: npm ci
        workingDirectory: tracks/typescript
        displayName: Install TypeScript dependencies
      - script: npm run build
        workingDirectory: tracks/typescript
        displayName: Type-check TypeScript track
      - script: npm test
        workingDirectory: tracks/typescript
        displayName: Test TypeScript track
